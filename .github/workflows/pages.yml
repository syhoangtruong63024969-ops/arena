name: Deploy Voicekey to GitHub Pages

# Opt-in deployment only. Enable Settings → Pages → GitHub Actions first.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build under the repository Pages path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PLAN_PRICE_VND: ${{ vars.VITE_PLAN_PRICE_VND }}
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static storefront
        id: deployment
        uses: actions/deploy-pages@v4
